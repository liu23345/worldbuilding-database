<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7fb">
<title>造境誌｜角色與世界觀資料庫</title>
<style>
:root{--bg:#f6f7fb;--paper:#fff;--ink:#24283a;--muted:#7c8297;--line:#e7e8f0;--accent:#6858d9;--accent-light:#f0edff;--rose:#c45b7b;--teal:#278b83;--gold:#ae7b28;--shadow:0 12px 34px rgba(39,38,79,.065)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;padding:28px 22px 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:27px}.brand{display:flex;align-items:center;gap:12px}.sigil{width:47px;height:47px;border-radius:15px;background:linear-gradient(135deg,#7769e8,#a49af7);display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 8px 18px #6858d930}.brand h1{font-size:20px;margin:0;letter-spacing:.5px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:#555b70;border-radius:11px;padding:10px 13px;font-size:12px;font-weight:650}.btn:hover{border-color:#c8c1fa;color:var(--accent)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.primary:hover{background:#5747c5}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:28px 0 23px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}.intro h2{font-size:clamp(27px,4vw,37px);letter-spacing:-.8px;margin:8px 0}.intro p{margin:0;color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:16px 18px;box-shadow:var(--shadow)}.stat label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:8px}.stat strong small{font-size:12px;color:var(--muted);font-weight:500}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}.sidebar,.main-panel{background:var(--paper);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.sidebar{padding:14px;position:sticky;top:15px}.side-title{font-size:10px;color:#a0a4b5;font-weight:800;letter-spacing:1.5px;padding:10px 10px 8px}.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;color:#72788d;font-size:13px;margin-bottom:3px;cursor:pointer}.nav .nav-icon{width:22px;text-align:center;font-size:16px}.nav.active{background:var(--accent-light);color:var(--accent);font-weight:750}.nav:hover:not(.active){background:#f8f8fc}.side-note{margin:17px 3px 3px;padding:13px;background:#f8f7ff;border-radius:12px;color:#77739a;font-size:11px;line-height:1.7}.main-panel{min-height:570px;overflow:hidden}.main-head{padding:22px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.main-head h3{margin:0;font-size:18px}.main-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.search-row{padding:0 24px 17px;display:flex;gap:9px}.search{flex:1;min-width:0;border:1px solid var(--line);background:#fbfbfe;border-radius:11px;padding:11px 13px;outline:none;font-size:13px}.search:focus,.field:focus{border-color:#a59bf1;box-shadow:0 0 0 3px #6858d915}.chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 24px 16px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 11px;font-size:11px;color:#82879a}.chip.active{background:var(--accent-light);border-color:#e3dfff;color:var(--accent);font-weight:700}.cards{padding:0 24px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.entry{border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0;transition:.18s;background:#fff}.entry:hover{border-color:#d4cef9;transform:translateY(-1px);box-shadow:0 8px 20px #33314d08}.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.entry-symbol{width:39px;height:39px;border-radius:12px;background:#f0edff;display:grid;place-items:center;font-size:20px;flex-shrink:0}.entry-actions{display:flex;gap:3px}.mini{border:0;background:transparent;color:#9a9fb0;border-radius:7px;width:27px;height:27px}.mini:hover{background:#f2f1fb;color:var(--accent)}.entry h4{font-size:16px;margin:13px 0 6px;overflow-wrap:anywhere}.entry p{font-size:12px;line-height:1.7;color:#7b8194;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.entry-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:15px;padding-top:12px;border-top:1px solid #f0f0f5}.type{border-radius:6px;background:#f3f2fc;color:#6d60c4;padding:5px 7px;font-size:10px}.entry-bottom small{font-size:10px;color:#a0a4b3}.empty{grid-column:1/-1;text-align:center;padding:70px 15px;color:var(--muted)}.empty div{font-size:35px;margin-bottom:12px}.empty strong{display:block;color:#53596d;font-size:14px;margin-bottom:6px}.empty span{font-size:12px}.about{margin:0 24px 24px;padding:17px 18px;background:#f9f8ff;border:1px solid #eeebff;border-radius:14px}.about strong{font-size:12px;color:#5f55ad}.about p{font-size:12px;line-height:1.8;color:#85809f;margin:7px 0 0;white-space:pre-wrap}.modal-back{position:fixed;inset:0;background:#24223b6b;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-back.show{display:flex}.modal{background:#fff;border-radius:19px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 70px #17152b30}.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0;font-size:17px}.close{border:0;background:#f3f4f8;border-radius:9px;width:31px;height:31px;font-size:18px;color:#777}.form{padding:21px 23px 23px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.form label{display:block;font-size:12px;color:#6f7588;font-weight:700;margin-bottom:7px}.form .full{grid-column:1/-1}.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;background:#fcfcfe;color:var(--ink);font-size:13px}.field.textarea{min-height:100px;resize:vertical;line-height:1.6}.form-foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:3px}.detail{padding:24px}.detail h2{margin:14px 0 8px;font-size:25px}.detail p{font-size:13px;line-height:1.9;color:#666e83;white-space:pre-wrap}.detail-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.detail-section h4{font-size:12px;color:#8c91a2;margin:0 0 8px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);opacity:0;background:#27283a;color:#fff;padding:11px 16px;border-radius:11px;font-size:12px;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.footer{text-align:center;color:#a5a9b8;font-size:10px;margin-top:23px}
@media(max-width:760px){.app{padding:18px 12px 32px}.top{align-items:flex-start}.top-actions{flex-direction:column}.top-actions .btn{padding:8px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px}.stat strong{font-size:24px}.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;gap:5px;overflow:auto;padding:9px}.side-title,.side-note{display:none}.nav{white-space:nowrap;margin:0;padding:10px}.main-head{padding:19px 16px 14px}.search-row,.chips{padding-left:16px;padding-right:16px}.cards{padding:0 16px 18px;grid-template-columns:1fr}.intro{margin:22px 0}.intro p{max-width:95%}.form{grid-template-columns:1fr}.form .full{grid-column:auto}.form-foot{grid-column:auto}.main-panel{min-height:400px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="sigil">✧</div><div><h1>造境誌</h1><p>角色與世界觀設定資料庫</p></div></div><div class="top-actions"><button class="btn" id="exportBtn">匯出資料 JSON ↗</button><button class="btn primary" id="addBtn">＋ 新增資料</button></div></header>
<section class="intro"><div><div class="eyebrow">THE WORLDBUILDING ARCHIVE</div><h2>讓想像，有跡可循。</h2><p>收納角色、勢力、地點與傳說，讓每一條設定都成為世界的一部分。</p></div></section>
<section class="stats"><div class="stat"><label>全部資料</label><strong id="total">0 <small>筆</small></strong></div><div class="stat"><label>角色人物</label><strong id="characters">0 <small>位</small></strong></div><div class="stat"><label>勢力組織</label><strong id="factions">0 <small>個</small></strong></div><div class="stat"><label>地點與傳說</label><strong id="places">0 <small>筆</small></strong></div></section>
<main class="layout"><aside class="sidebar"><div class="side-title">資料分類</div><div class="nav active" data-view="all"><span class="nav-icon">▦</span>全部資料</div><div class="nav" data-view="character"><span class="nav-icon">♙</span>角色人物</div><div class="nav" data-view="faction"><span class="nav-icon">⚑</span>勢力組織</div><div class="nav" data-view="location"><span class="nav-icon">⌖</span>地理地點</div><div class="nav" data-view="lore"><span class="nav-icon">✧</span>歷史與傳說</div><div class="nav" data-view="item"><span class="nav-icon">◇</span>物品與概念</div><div class="side-note">✦ 設定提示<br>試著為角色記錄「欲望、恐懼與秘密」，讓人物不只是資料，而是故事的引擎。</div></aside>
<section class="main-panel"><div class="main-head"><div><h3 id="sectionTitle">全部資料</h3><p id="sectionDesc">你的世界觀，從這裡逐漸成形。</p></div><span class="type" id="resultCount">0 筆資料</span></div><div class="search-row"><input class="search" id="search" placeholder="搜尋名稱、描述、關鍵字…" aria-label="搜尋資料"><button class="btn" id="resetSearch">清除</button></div><div class="chips" id="chips"><button class="chip active" data-tag="all">全部標籤</button><button class="chip" data-tag="主角">主角</button><button class="chip" data-tag="反派">反派</button><button class="chip" data-tag="魔法">魔法</button><button class="chip" data-tag="歷史">歷史</button><button class="chip" data-tag="待補完">待補完</button></div><div class="cards" id="cards"></div><div class="about"><strong>✦ 世界觀備忘</strong><p id="memoText">在這裡記下世界的核心規則、創作方向或尚未解決的謎題。</p><button class="btn" id="editMemo" style="margin-top:10px">編輯備忘</button></div></section></main>
<div class="footer">造境誌 · 讓每個設定，都找到自己的位置</div></div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h3 id="modalTitle">新增資料</h3><button class="close" id="closeModal" aria-label="關閉">×</button></div><form class="form" id="entryForm"><input type="hidden" id="entryId"><div><label for="entryType">資料分類</label><select class="field" id="entryType"><option value="character">角色人物</option><option value="faction">勢力組織</option><option value="location">地理地點</option><option value="lore">歷史與傳說</option><option value="item">物品與概念</option></select></div><div><label for="entryName">名稱 *</label><input class="field" id="entryName" maxlength="90" required placeholder="例如：卡西安・塞德里克"></div><div><label for="entryTags">標籤（以逗號分隔）</label><input class="field" id="entryTags" placeholder="主角, 魔法, 待補完"></div><div><label for="entrySymbol">圖示 Emoji</label><input class="field" id="entrySymbol" maxlength="8" placeholder="✧"></div><div class="full"><label for="entrySummary">簡介</label><textarea class="field textarea" id="entrySummary" maxlength="1200" placeholder="這個設定是什麼？在世界中扮演什麼角色？"></textarea></div><div class="full"><label for="entryDetails">詳細設定／背景／能力／關係</label><textarea class="field textarea" id="entryDetails" maxlength="5000" placeholder="補充背景、動機、歷史、能力限制、人物關係或其他細節…"></textarea></div><div class="form-foot"><button type="button" class="btn" id="cancelModal">取消</button><button class="btn primary" type="submit">儲存資料</button></div></form></div></div>
<div class="modal-back" id="memoBack"><div class="modal"><div class="modal-head"><h3>世界觀備忘</h3><button class="close" id="closeMemo">×</button></div><form class="form" id="memoForm"><div class="full"><label for="memoInput">核心規則與創作筆記</label><textarea class="field textarea" id="memoInput" maxlength="4000" placeholder="例如：魔法的代價、歷史時間線、故事主題…"></textarea></div><div class="form-foot"><button type="button" class="btn" id="cancelMemo">取消</button><button class="btn primary" type="submit">儲存備忘</button></div></form></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const KEY='zaojingzhi-archive-v1', MEMO='zaojingzhi-memo-v1';
const typeNames={character:'角色人物',faction:'勢力組織',location:'地理地點',lore:'歷史與傳說',item:'物品與概念'};
const typeIcons={character:'♙',faction:'⚑',location:'⌖',lore:'✧',item:'◇'};
let entries=[],view='all',tag='all';
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
function render(){
 $('total').innerHTML=entries.length+' <small>筆</small>';
 $('characters').innerHTML=entries.filter(x=>x.type==='character').length+' <small>位</small>';
 $('factions').innerHTML=entries.filter(x=>x.type==='faction').length+' <small>個</small>';
 $('places').innerHTML=entries.filter(x=>['location','lore'].includes(x.type)).length+' <small>筆</small>';
 const titles={all:'全部資料',...typeNames};$('sectionTitle').textContent=titles[view];$('sectionDesc').textContent=view==='all'?'你的世界觀，從這裡逐漸成形。':`整理所有「${titles[view]}」相關設定。`;
 const q=$('search').value.trim().toLowerCase();
 const list=entries.filter(x=>(view==='all'||x.type===view)&&(tag==='all'||(x.tags||[]).includes(tag))&&(!q||[x.name,x.summary,x.details,(x.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)));
 $('resultCount').textContent=list.length+' 筆資料';
 $('cards').innerHTML=list.length?list.map(x=>`<article class="entry"><div class="entry-top"><div class="entry-symbol">${esc(x.symbol||typeIcons[x.type])}</div><div class="entry-actions"><button class="mini" title="查看詳情" aria-label="查看詳情" data-action="detail" data-id="${x.id}">↗</button><button class="mini" title="編輯" aria-label="編輯" data-action="edit" data-id="${x.id}">✎</button><button class="mini" title="刪除" aria-label="刪除" data-action="delete" data-id="${x.id}">×</button></div></div><h4>${esc(x.name)}</h4><p>${esc(x.summary||'尚未填寫簡介。')}</p><div class="entry-bottom"><span class="type">${typeNames[x.type]}</span><small>${(x.tags||[]).length?esc((x.tags||[]).slice(0,2).join(' · ')):'未設定標籤'}</small></div></article>`).join(''):`<div class="empty"><div>✧</div><strong>${q?'找不到符合的設定':'這個分類還是空白的'}</strong><span>${q?'試試其他關鍵字或清除搜尋條件。':'新增第一筆資料，開始建構你的世界。'}</span></div>`;
 document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));
 document.querySelectorAll('.chip').forEach(n=>n.classList.toggle('active',n.dataset.tag===tag));
}
function openForm(x=null){$('entryForm').reset();$('entryId').value=x?.id||'';$('modalTitle').textContent=x?'編輯資料':'新增資料';if(x){$('entryType').value=x.type;$('entryName').value=x.name;$('entryTags').value=(x.tags||[]).join(', ');$('entrySymbol').value=x.symbol||'';$('entrySummary').value=x.summary||'';$('entryDetails').value=x.details||''} $('modalBack').classList.add('show');$('entryName').focus()}
function closeForm(){$('modalBack').classList.remove('show')}
function openDetail(x){const b=$('modalBack');$('modalTitle').textContent=typeNames[x.type]+'・詳細設定';$('entryForm').style.display='none';let d=document.createElement('div');d.className='detail';d.id='detailBody';d.innerHTML=`<div class="entry-symbol">${esc(x.symbol||typeIcons[x.type])}</div><h2>${esc(x.name)}</h2><span class="type">${typeNames[x.type]}</span><div class="detail-section"><h4>簡介</h4><p>${esc(x.summary||'尚未填寫。')}</p></div><div class="detail-section"><h4>詳細設定／背景／能力／關係</h4><p>${esc(x.details||'尚未填寫。')}</p></div><div class="detail-section"><h4>標籤</h4><p>${esc((x.tags||[]).join(' · ')||'未設定標籤')}</p></div><button class="btn primary" id="detailEdit" style="margin-top:18px">編輯這筆資料</button>`;document.querySelector('#modal .detail')?.remove();$('entryForm').after(d);b.classList.add('show');$('detailEdit').onclick=()=>{d.remove();$('entryForm').style.display='grid';closeForm();openForm(x)}}
function clearDetail(){document.querySelector('#modal .detail')?.remove();$('entryForm').style.display='grid'}
$('addBtn').onclick=()=>{clearDetail();openForm()};$('closeModal').onclick=()=>{closeForm();clearDetail()};$('cancelModal').onclick=()=>{closeForm();clearDetail()};
$('modalBack').addEventListener('click',e=>{if(e.target===$('modalBack')){closeForm();clearDetail()}});
$('entryForm').addEventListener('submit',e=>{e.preventDefault();const name=$('entryName').value.trim();if(!name)return;const id=$('entryId').value;const obj={id:id||Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:$('entryType').value,name,tags:$('entryTags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),symbol:$('entrySymbol').value.trim(),summary:$('entrySummary').value.trim(),details:$('entryDetails').value.trim(),updatedAt:new Date().toISOString()};if(id){entries=entries.map(x=>x.id===id?obj:x)}else entries.unshift(obj);save();render();closeForm();toast(id?'設定已更新':'新設定已收錄')});
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{view=n.dataset.view;render()});
document.querySelectorAll('.chip').forEach(n=>n.onclick=()=>{tag=n.dataset.tag;render()});
$('search').addEventListener('input',render);$('resetSearch').onclick=()=>{$('search').value='';render()};
$('cards').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const x=entries.find(a=>a.id===b.dataset.id);if(!x)return;if(b.dataset.action==='detail')openDetail(x);if(b.dataset.action==='edit'){clearDetail();openForm(x)}if(b.dataset.action==='delete'&&confirm(`確定刪除「${x.name}」嗎？`)){entries=entries.filter(a=>a.id!==x.id);save();render();toast('資料已刪除')}});
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),entries,memo:localStorage.getItem(MEMO)||''},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='造境誌-世界觀資料.json';a.click();URL.revokeObjectURL(a.href);toast('資料 JSON 已匯出')};
function showMemo(){ $('memoText').textContent=localStorage.getItem(MEMO)||'在這裡記下世界的核心規則、創作方向或尚未解決的謎題。'}
$('editMemo').onclick=()=>{$('memoInput').value=localStorage.getItem(MEMO)||'';$('memoBack').classList.add('show')};$('closeMemo').onclick=$('cancelMemo').onclick=()=>$('memoBack').classList.remove('show');$('memoBack').addEventListener('click',e=>{if(e.target===$('memoBack'))$('memoBack').classList.remove('show')});$('memoForm').onsubmit=e=>{e.preventDefault();localStorage.setItem(MEMO,$('memoInput').value.trim());showMemo();$('memoBack').classList.remove('show');toast('世界觀備忘已儲存')};
try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[]}catch{entries=[]}showMemo();render();
</script></body></html>
